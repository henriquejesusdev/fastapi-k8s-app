name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fastapi-app:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v3
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/pyproject.toml', '**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Run tests
        run: poetry run pytest

      - name: Build package
        run: poetry build

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Run Docker container
        run: |
          docker run -d --name fastapi-app -p 8000:8000 $IMAGE_NAME
          for i in {1..10}; do
            if curl --fail http://localhost:8000/; then
              docker rm -f fastapi-app
              exit 0
            fi
            sleep 2
          done
          docker logs fastapi-app
          docker rm -f fastapi-app
          exit 1
